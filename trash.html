<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本垃圾分類 AI 辨識器</title>
    <!-- 引入 TensorFlow.js 與 Teachable Machine 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 20px; background-color: #f5f5f7; display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 1.4rem; color: #333; margin-bottom: 15px; text-align: center; }
        #webcam-container { width: 100%; max-width: 400px; height: 300px; background: #000; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; }
        canvas { width: 100% !important; height: 100% !important; object-fit: cover; }
        .btn { margin-top: 15px; padding: 12px 24px; background: #007aff; color: white; border: none; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #ccc; }
        #label-container { width: 100%; max-width: 400px; margin-top: 20px; }
        .result-card { background: white; padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-weight: bold; }
        .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: #34c759; width: 0%; transition: width 0.2s ease; }
    </style>
</head>
<body>

    <h1>🇯🇵 日本垃圾分類 AI 辨識器</h1>
    
    <div id="webcam-container"></div>
    <button class="btn" id="start-btn" onclick="init()">啟動鏡頭</button>
    
    <div id="label-container"></div>

    <script type="text/javascript">
        // ⚠️ 請替換為你在 Teachable Machine 匯出的模型網址
        const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_ID/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            document.getElementById("start-btn").disabled = true;
            document.getElementById("start-btn").innerText = "載入AI模型中...";

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // 載入模型與 Metadata
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // 設定鏡頭（後置鏡頭優先）
            const flip = false; // 手機後置鏡頭不需要鏡像
            webcam = new tmImage.Webcam(300, 300, flip);
            
            // 請求手機相機權限（使用後置鏡頭 facingMode: "environment"）
            await webcam.setup({ facingMode: "environment" });
            await webcam.play();
            window.requestAnimationFrame(loop);

            // 貼上畫面上傳元素
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const card = document.createElement("div");
                card.className = "result-card-wrapper";
                card.innerHTML = `
                    <div class="result-card">
                        <span class="class-name">--</span>
                        <span class="class-prob">0%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill"></div></div>
                `;
                labelContainer.appendChild(card);
            }

            document.getElementById("start-btn").style.display = "none";
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = (prediction[i].probability * 100).toFixed(0);

                const cardWrapper = labelContainer.childNodes[i];
                cardWrapper.querySelector(".class-name").innerText = className;
                cardWrapper.querySelector(".class-prob").innerText = probability + "%";
                cardWrapper.querySelector(".progress-fill").style.width = probability + "%";
            }
        }
    </script>
</body>
</html>
