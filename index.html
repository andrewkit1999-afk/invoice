<script>
    function formatDateDisplay(dateVal) {
        if (!dateVal) return "";
        const parts = dateVal.split("-");
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        return dateVal;
    }

    function setTodayDate() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById('inDate').value = `${year}-${month}-${day}`;
        updatePreview();
    }

    function formatAmountInput(input) {
        let value = input.value.replace(/[^0-9.]/g, '');
        const parts = value.split('.');
        if (parts.length > 2) value = parts[0] + '.' + parts.slice(1).join('');
        if (parts[0]) {
            parts[0] = Number(parts[0]).toLocaleString('en-US');
            input.value = parts.join('.');
        } else {
            input.value = value;
        }
    }

    function updatePreview() {
        document.getElementById('outTo').innerText = document.getElementById('inTo').value;
        document.getElementById('outFrom').innerText = document.getElementById('inFrom').value;
        document.getElementById('outTitle').innerText = document.getElementById('inTitle').value;
        const rawDate = document.getElementById('inDate').value;
        document.getElementById('outDate').innerText = formatDateDisplay(rawDate);
        document.getElementById('outDetails').innerText = document.getElementById('inDetails').value;
        const curr = document.getElementById('inCurrency').value;
        document.getElementById('outCurrency').innerText = curr;
        document.getElementById('outCurrencySymbol').innerText = (curr === 'RMB') ? '¥' : '$';
        document.getElementById('outAmount').innerText = document.getElementById('inAmount').value;
        document.getElementById('outPayNote').innerText = document.getElementById('inPayNote').value;
        document.getElementById('outBankInfo').innerText = document.getElementById('inBankInfo').value;
    }

    function generateCanvas() {
        const element = document.getElementById('invoiceCard');
        return html2canvas(element, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    }

    function downloadPNG() {
        generateCanvas().then(canvas => {
            const link = document.createElement('a');
            const toName = document.getElementById('inTo').value.trim() || 'Invoice';
            const dateStr = document.getElementById('outDate').innerText.replaceAll('/', '-').trim() || 'Date';
            link.download = `收據_${toName}_${dateStr}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    // 📱 手機 Chrome 最佳化分享方案
    async function shareToWhatsApp() {
        const toName = document.getElementById('inTo').value.trim() || '客戶';
        const dateStr = document.getElementById('outDate').innerText.trim();
        const amount = document.getElementById('outAmount').innerText.trim();
        const currency = document.getElementById('inCurrency').value;
        const symbol = (currency === 'RMB') ? '¥' : '$';

        const shareText = `你好！此為 ${toName} 的單據，金額為 ${currency} ${symbol}${amount} (${dateStr})。`;

        try {
            const canvas = await generateCanvas();
            canvas.toBlob(async (blob) => {
                const file = new File([blob], `收據_${toName}.png`, { type: 'image/png' });

                // 嘗試 1：原生的 Web Share API (部分支援的流動裝置)
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: '收據',
                            text: shareText
                        });
                        return;
                    } catch (e) {
                        console.log("Web Share 取消或失敗，轉用剪貼簿備用方案。");
                    }
                }

                // 嘗試 2：複製圖片至剪貼簿 + 自動跳轉 WhatsApp (手機 Chrome 最穩定方案)
                try {
                    const data = [new ClipboardItem({ 'image/png': blob })];
                    await navigator.clipboard.write(data);
                    alert("✅ 收據圖片已成功複製！\n即將為你開啟 WhatsApp，請在對話框「長按」並選擇「貼上」即可發送。");
                } catch (clipErr) {
                    // 嘗試 3：如果連剪貼簿都不支援，則先自動下載圖片
                    downloadPNG();
                    alert("已為你下載收據圖片！頁面將自動開啟 WhatsApp，請附加下載好的圖片發送。");
                }

                // 開啟 WhatsApp 應用程式
                const encodedText = encodeURIComponent(shareText);
                window.location.href = `whatsapp://send?text=${encodedText}`;

            }, 'image/png');
        } catch (err) {
            console.error('分享失敗:', err);
            alert('生成圖片時出錯，請改用「下載 PNG 圖片」功能。');
        }
    }
</script>
